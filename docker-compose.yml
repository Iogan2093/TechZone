name: techzone

services:
  postgres:
    image: postgres:16-alpine
    container_name: techzone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: techzone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - techzone_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techzone"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techzone-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: techzone-image
    container_name: techzone-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=techzone;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - techzone-net

volumes:
  techzone_data:
    driver: local

networks:
  techzone-net:
    driver: bridge